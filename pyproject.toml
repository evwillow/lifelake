[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifelake"
version = "0.1.0"
description = "A personal data lake in DuckDB: incremental connectors, secret redaction at ingest, and read-only safe views"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5,<2", "pyarrow>=15", "pytz>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lifelake = "lifelake.cli:main"

[tool.setuptools.packages.find]
include = ["lifelake*"]

[tool.setuptools.package-data]
lifelake = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
